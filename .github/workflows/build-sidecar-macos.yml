name: Build macOS sidecar

# One-off build of the UniGate sidecar for macOS (arm64) from unigate/udp-masque.
# cgo is required: cronet-go ships only libcronet.a for darwin (no dylib), so a
# purego build cannot work. The artifact is uploaded to the sidecar release.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true

      - name: Build sing-box (cgo, static cronet)
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
        run: |
          set -euo pipefail
          mkdir -p dist
          go build \
            -tags "with_naive_outbound,with_quic,with_gvisor,with_wireguard,with_utls,with_clash_api" \
            -trimpath \
            -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=1.14.4" \
            -o dist/sing-box ./cmd/sing-box
          file dist/sing-box
          dist/sing-box version

      - name: Package
        run: |
          set -euo pipefail
          cd dist
          tar czf ../sing-box-1.14.4-masque.3-darwin-arm64.tar.gz sing-box
          cd ..
          shasum -a 256 sing-box-1.14.4-masque.3-darwin-arm64.tar.gz | tee SHA256SUMS.txt

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload singbox-1.14.4-masque.3 \
            sing-box-1.14.4-masque.3-darwin-arm64.tar.gz --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-darwin-arm64
          path: |
            sing-box-1.14.4-masque.3-darwin-arm64.tar.gz
            SHA256SUMS.txt
